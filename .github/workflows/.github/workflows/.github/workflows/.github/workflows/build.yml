
name: Build Vengeful Woods

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          unzip -q VengefulWoods-scrollable-skill-screen-source.zip -d source

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        working-directory: source/vwsrc
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vengeful-Woods-JAR
          path: source/vwsrc/build/libs/*.jar
